[package]
name = "flasher-e2e"
description = "Browser end-to-end test harness: real Chromium against the real `flasher` binary"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chromiumoxide = "0.9"
# Seeding + white-box DB assertions for tests (second WAL connection to
# the per-test database the spawned server uses).
flasher-store = { path = "../flasher-store" }
futures = "0.3"
# Health-readiness probe over plain loopback HTTP only; no TLS needed.
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
