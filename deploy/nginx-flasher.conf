# Flasher (Rust rewrite) — nginx snippet for carstenfuehrmann.org
#
# carstenfuehrmann.org already has a vhost (serving the top-level site).
# Add ONLY this location block to that existing HTTPS server block —
# do not create a second vhost for the same name.

# The app serves UI + /api on the same port and binds 127.0.0.1 only.
# NOTE: requires the Phase 7 "base path" task (app served under /flasher/).
location /flasher/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The app does not use WebSockets; no Upgrade headers needed.
}
