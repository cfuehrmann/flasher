# Flasher (Rust rewrite) — nginx vhost snippet.
# The app serves UI + /api on the same port and binds 127.0.0.1 only.
# Adjust server_name and the certificate paths, then reload nginx.

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN_HERE;

    # Existing certificate for DOMAIN_HERE (e.g. via certbot):
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_HERE/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app does not use WebSockets; no Upgrade headers needed.
    }
}

# Optional: redirect plain HTTP.
server {
    listen 80;
    server_name DOMAIN_HERE;
    return 301 https://$host$request_uri;
}
