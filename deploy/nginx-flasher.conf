# Flasher (Rust rewrite) — nginx vhost for flasher.carstenfuehrmann.org
#
# Install to /etc/nginx/sites-available/flasher, symlink into sites-enabled,
# then run `certbot --nginx -d flasher.carstenfuehrmann.org` once — certbot
# adds the 443 listener and the HTTP->HTTPS redirect automatically.
#
# The app serves UI + /api on the same port and binds 127.0.0.1 only.

server {
    listen 80;
    server_name flasher.carstenfuehrmann.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app does not use WebSockets; no Upgrade headers needed.
    }
}
