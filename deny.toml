# cargo-deny configuration — kept intentionally minimal.

[advisories]
# Advisory db-path left at its default ( ~/.cargo/advisory-db ).
# cargo-deny 0.18: vulnerabilities are denied by default (the `vulnerability`
# and `notice` keys were removed, EmbarkStudios/cargo-deny#611).
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Allow-list of licenses acceptable in this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Permissive data license of `webpki-roots` (Mozilla CA bundle) since
    # upstream relicensed it; pulled in by every rustls-based TLS stack.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
