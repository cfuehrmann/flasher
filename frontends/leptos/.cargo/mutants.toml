# Mutation-testing registry for the detached leptos workspace.
#
# Doctrine: every mutant in src/markdown.rs is either CAUGHT by a test,
# UNVIABLE, or documented here as equivalent / structurally untestable.
# The exclusions below are those documented cases; each entry states why
# no host-target test can or must kill it. Regexes are matched against the
# full mutant name (`src/markdown.rs:LINE:COL: ...`) and are line-anchored
# where the operator description alone would also match covered mutants —
# update the anchors if the code above the tests moves.

exclude_re = [
    # --- Documented equivalent -------------------------------------------------
    # render_html:32 `|` -> `^`: Options::ENABLE_TABLES and ENABLE_MATH are
    # disjoint single-bit flags, so bitwise-or and bitwise-xor compute the
    # identical value. Equivalent by construction; nothing to test.
    'replace \| with \^ in render_html',

    # --- Browser-only KaTeX interop (wasm / js-sys) -----------------------------
    # The whole `katex` module (schedule_render, ensure_assets_loaded,
    # attempt, try_render) is #[cfg(feature = "csr")] JS interop: it touches
    # `document`, `window` globals and `Reflect`, none of which exist on the
    # host target, so host unit tests structurally cannot observe it. It is
    # covered by the browser e2e suite (crates/flasher-e2e/tests/05_markdown.rs),
    # which runs the real csr build in Chromium and asserts typeset math.
    # (ensure_assets_loaded's let-chain `&&` -> `||` is already UNVIABLE:
    # let-chains only allow `&&`.)
    'katex::',

    # --- Hang-only mutants: infinite loop, no fast observable behavior ---------
    # Each of these stops a loop in autolink_line / trim_trailing_punctuation
    # from advancing its index. The mutant never produces wrong OUTPUT: any
    # test input that reaches it loops forever, so the suite could only ever
    # detect it as a timeout. The loops' real progress/termination behavior
    # is pinned by markdown::tests on the surrounding logic; these are
    # excluded so a run does not burn its budget rediscovering hangs.

    # 113:54 `==` -> `!=`: take_while counts a 0-length backtick run,
    # `i += 0` never advances.
    'markdown\.rs:113:54:',
    # 122:15 / 133:21 / 144:11 `+=` -> `*=`: i *= 1 or end *= 1 freezes the
    # index on the first iteration.
    'replace \+= with \*= in autolink_line',
    # 144:11 `+=` -> `-=`: i oscillates (e.g. 0<->1 behind a backtick)
    # forever. (The `-=` mutants at 122:15/133:21 underflow-panic instead
    # and stay test-covered, hence the line anchor.)
    'markdown\.rs:144:11: replace \+= with -=',
    # 126:13 / 127:13 / 129:13 `&&` -> `||`: the weakened URL-start guard
    # enters the autolink branch at delimiter bytes, where the end-scan
    # returns end == i and `i = end` never advances. (132:36 `&&` -> `||`
    # fails fast on wrong output and stays covered, hence the line anchors.)
    'markdown\.rs:12[679]:13: replace && with \|\|',
    # 132:23 `<` -> `==` / `>` and 132:39 `!` deleted: the end-scan never
    # starts, end == i, `i = end` loops forever. (110:13 `<` mutants,
    # 132:23 `<` -> `<=` and 127:16 `!` deletion fail fast and stay
    # covered, hence the operator-anchored patterns.)
    'markdown\.rs:132:23: replace < with ==',
    'markdown\.rs:132:23: replace < with >',
    'markdown\.rs:132:39:',
    # 135:64 `+ i` -> `* i`: end == 0 for a URL at line start, `i = end`
    # loops forever. (`+` -> `-` fails fast and stays covered.)
    'markdown\.rs:135:64: replace \+ with \*',
    # 162:5 -> 0: the caller computes `end = 0 + i` and loops forever on any
    # bare URL. The function's real contract is pinned directly by
    # markdown::tests::trim_trailing_punctuation_strips_exactly_the_trailing_junk.
    'replace trim_trailing_punctuation -> usize with 0',
    # 171:66 `-=` -> `/=`: end /= 1 never shrinks when there is trailing
    # punctuation to strip. (`-=` -> `+=` underflow-panics fast and 174:21
    # stays covered, hence the operator-anchored pattern.)
    'markdown\.rs:171:66: replace -= with /=',

    # --- Browser-only History/Location glue in route.rs --------------------------
    # starts_revealed, current_path, push_tab, replace_tab, push_edit,
    # push_groom_edit, replace_quiz_solution and the with_history helper are
    # #[cfg(feature = "csr")] wrappers around window.location / History
    # (pushState/replaceState), which do not exist on the host target — host
    # unit tests structurally cannot observe them. The pure route-parsing
    # layer they serve (path_to_route, Route::tab) is unit-tested, and the
    # glue itself is covered by the browser e2e suite
    # (crates/flasher-e2e/tests/08_routing.rs, 09_state_restore.rs), which
    # drives real reloads, deep links and Back/Forward in Chromium.
    'route\.rs:.* in (starts_revealed|current_path|push_tab|replace_tab|push_edit|push_groom_edit|replace_quiz_solution|with_history)',
    'replace (starts_revealed|current_path|push_tab|replace_tab|push_edit|push_groom_edit|replace_quiz_solution|with_history) -> ',
    'replace (push_tab|replace_tab|push_edit|push_groom_edit|replace_quiz_solution|with_history) with \(\)',
]
