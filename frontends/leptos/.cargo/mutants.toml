# Mutation-testing registry for the detached leptos workspace.
#
# Doctrine: every mutant in src/markdown.rs is either CAUGHT by a test,
# UNVIABLE, or documented here as equivalent / structurally untestable.
# The exclusions below are those documented cases; each entry states why
# no host-target test can or must kill it. Regexes are matched against the
# full mutant name (`src/markdown.rs:LINE:COL: ...`) and are line-anchored
# where the operator description alone would also match covered mutants —
# update the anchors if the code above the tests moves.

exclude_re = [
    # --- Documented equivalent -------------------------------------------------
    # render_html:32 `|` -> `^`: Options::ENABLE_TABLES and ENABLE_MATH are
    # disjoint single-bit flags, so bitwise-or and bitwise-xor compute the
    # identical value. Equivalent by construction; nothing to test.
    'replace \| with \^ in render_html',

    # --- Browser-only KaTeX interop (wasm / js-sys) -----------------------------
    # The whole `katex` module (schedule_render, ensure_assets_loaded,
    # attempt, try_render) is #[cfg(feature = "csr")] JS interop: it touches
    # `document`, `window` globals and `Reflect`, none of which exist on the
    # host target, so host unit tests structurally cannot observe it. It is
    # covered by the browser e2e suite (crates/flasher-e2e/tests/05_markdown.rs),
    # which runs the real csr build in Chromium and asserts typeset math.
    # (ensure_assets_loaded's let-chain `&&` -> `||` is already UNVIABLE:
    # let-chains only allow `&&`.)
    'katex::',

    # --- Hang-only mutants: infinite loop, no fast observable behavior ---------
    # Each of these stops a loop in autolink_line / trim_trailing_punctuation
    # from advancing its index. The mutant never produces wrong OUTPUT: any
    # test input that reaches it loops forever, so the suite could only ever
    # detect it as a timeout. The loops' real progress/termination behavior
    # is pinned by markdown::tests on the surrounding logic; these are
    # excluded so a run does not burn its budget rediscovering hangs.

    # 113:54 `==` -> `!=`: take_while counts a 0-length backtick run,
    # `i += 0` never advances.
    'markdown\.rs:113:54:',
    # 122:15 / 133:21 / 144:11 `+=` -> `*=`: i *= 1 or end *= 1 freezes the
    # index on the first iteration.
    'replace \+= with \*= in autolink_line',
    # 144:11 `+=` -> `-=`: i oscillates (e.g. 0<->1 behind a backtick)
    # forever. (The `-=` mutants at 122:15/133:21 underflow-panic instead
    # and stay test-covered, hence the line anchor.)
    'markdown\.rs:144:11: replace \+= with -=',
    # 126:13 / 127:13 / 129:13 `&&` -> `||`: the weakened URL-start guard
    # enters the autolink branch at delimiter bytes, where the end-scan
    # returns end == i and `i = end` never advances. (132:36 `&&` -> `||`
    # fails fast on wrong output and stays covered, hence the line anchors.)
    'markdown\.rs:12[679]:13: replace && with \|\|',
    # 132:23 `<` -> `==` / `>` and 132:39 `!` deleted: the end-scan never
    # starts, end == i, `i = end` loops forever. (110:13 `<` mutants,
    # 132:23 `<` -> `<=` and 127:16 `!` deletion fail fast and stay
    # covered, hence the operator-anchored patterns.)
    'markdown\.rs:132:23: replace < with ==',
    'markdown\.rs:132:23: replace < with >',
    'markdown\.rs:132:39:',
    # 135:64 `+ i` -> `* i`: end == 0 for a URL at line start, `i = end`
    # loops forever. (`+` -> `-` fails fast and stays covered.)
    'markdown\.rs:135:64: replace \+ with \*',
    # 162:5 -> 0: the caller computes `end = 0 + i` and loops forever on any
    # bare URL. The function's real contract is pinned directly by
    # markdown::tests::trim_trailing_punctuation_strips_exactly_the_trailing_junk.
    'replace trim_trailing_punctuation -> usize with 0',
    # 171:66 `-=` -> `/=`: end /= 1 never shrinks when there is trailing
    # punctuation to strip. (`-=` -> `+=` underflow-panics fast and 174:21
    # stays covered, hence the operator-anchored pattern.)
    'markdown\.rs:171:66: replace -= with /=',

    # --- Browser-only History/Location glue in route.rs --------------------------
    # current_path, push_tab, replace_tab, push_edit, push_groom_edit and
    # the with_history helper are
    # #[cfg(feature = "csr")] wrappers around window.location / History
    # (pushState/replaceState), which do not exist on the host target — host
    # unit tests structurally cannot observe them. The pure route-parsing
    # layer they serve (path_to_route, Route::tab) is unit-tested, and the
    # glue itself is covered by the browser e2e suite
    # (crates/flasher-e2e/tests/08_routing.rs, 09_state_restore.rs), which
    # drives real reloads, deep links and Back/Forward in Chromium.
    'route\.rs:.* in (current_path|push_tab|replace_tab|push_edit|push_groom_edit|with_history)',
    'replace (current_path|push_tab|replace_tab|push_edit|push_groom_edit|with_history) -> ',
    'replace (push_tab|replace_tab|push_edit|push_groom_edit|with_history) with \(\)',

    # --- Browser-only component glue in groom.rs ------------------------------
    # The whole file is Leptos view/component code: signals, callbacks and
    # view! markup that only a DOM can observe, so host-target tests
    # structurally cannot kill these mutants (the ssr test renders only the
    # initial Loading state, and cargo-mutants generates no mutants inside
    # view! bodies). Every behavior they sit in IS pinned by the browser e2e
    # suite (crates/flasher-e2e/tests/04_groom.rs), which drives the real csr
    # build in Chromium: the search debounce + unicode folding, paging
    # arithmetic and the page-info line, the enable/disable toggle, delete
    # (incl. last-item-on-page and the learned-card progress warning), the
    # progress reset, and the row "⋯" menu open/dismiss. The generation
    # counters in groom.rs AND quiz.rs (debounce/stale-fetch guards) are race
    # guards no state-based browser test can drive deterministically; they
    # are defensive by design.
    'quiz\.rs:\d+:\d+: replace \+= with (-=|\*=) in Quiz',
    'quiz\.rs:\d+:\d+: replace != with == in Quiz',
    'groom\.rs:\d+:\d+: .* in (Groom|ConfirmAction::progress_warning|due_label)$',
    'replace (as_i64|due_label) -> ',
    # ConfirmAction's modal-text helpers: pure, but only the browser e2e
    # modal assertions observe their output (04_groom.rs checks the
    # question, the confirm label and the progress warning verbatim).
    'replace ConfirmAction::(question|confirm_label|card|progress_warning) -> ',
    # --- Browser-only localStorage glue in groom.rs --------------------------
    # storage_get/storage_set wrap window.localStorage, which does not
    # exist on the host target; initial_filter/initial_search only READ
    # that storage under csr — under the ssr test build the cfg'd branch
    # vanishes, so host tests can only ever observe the default path.
    # The behavior (persist filter + search, restore on remount/reload)
    # is pinned by the browser e2e suite (crates/flasher-e2e/tests/
    # 04_groom.rs::filter_and_search_survive_tab_switch_and_reload),
    # which drives a tab switch and a real reload in Chromium.
    'groom\.rs:\d+:\d+: .* in (storage_get|storage_set|initial_filter|initial_search)$',
    'replace (storage_get|initial_search) -> ',
    'replace initial_filter -> ',
    # Function-body replacement of the storage write: no host-target test
    # can observe a missing localStorage write; the persistence e2e would
    # fail in the browser (the filter/search would not survive reload).
    'replace storage_set with \(\)',
    # now_ms is #[cfg(feature = "csr")] js-sys (wasm-only by construction);
    # the non-csr stub exists only to keep the ssr view linkable (replacing
    # it with 0 is UNVIABLE — that is its body).
    'replace now_ms -> ',

    # --- Browser-only viewport-fit glue in groom.rs (owner wish 2026-07-31) --
    # measure_viewport_fit / apply_fit / initial_take wrap window, document,
    # getComputedStyle and localStorage — none of which exist on the host
    # target, so host unit tests structurally cannot observe them (initial_take
    # is feature-gated to csr precisely because storage_get only exists
    # there). Their behavior IS pinned by the browser e2e suite
    # (crates/flasher-e2e/tests/04_groom.rs):
    # viewport_fit_fills_page_without_scroll_or_underfill fails if the
    # available-space or row-pitch arithmetic is wrong (any of the +/-/*
    # mutants), resize_refits_and_keeps_anchor pins apply_fit's page
    # re-anchoring (page * old / fit) and the persisted take, and the
    # two-phase tests (delete/toggle_last_item) read the persisted take back
    # through initial_take on reload. The pure core they feed
    # (rows_that_fit, px) is unit-tested and fully caught.
    'groom\.rs:\d+:\d+: .* in (measure_viewport_fit|apply_fit|initial_take)$',
    'replace (measure_viewport_fit|initial_take) -> ',
    'replace apply_fit with \(\)',
    # --- Browser-only sticky-header glue in lib.rs ---------------------------
    # export_top_height measures the .top header via getBoundingClientRect
    # and sets the --top-h CSS variable — DOM APIs that do not exist on the
    # host target. Pinned by sticky_chrome_keeps_header_and_controls_pinned
    # (04_groom.rs): the groom chrome only sits directly below the sticky
    # header when --top-h carries the measured height.
    'replace export_top_height with \(\)',

    # --- Browser-only authenticated app shell/navigation glue in lib.rs -----
    # App is only rendered after the asynchronous CSR session probe succeeds;
    # host-target SSR tests stop at the checking/auth views and cannot observe
    # its navigation callbacks or responsive DOM attributes. The complete
    # shell behavior is pinned by the Chromium suite: 02_screenshots drives
    # drawer open/close, Escape, inert/aria-hidden state, focus restoration,
    # and all responsive screenshots; 08_routing/09_state_restore exercise
    # tab navigation, deep links, and editor restoration. The two small
    # helpers are called only by that browser-visible shell.
    'lib\.rs:\d+:\d+: .* in App$',
    'lib\.rs:\d+:\d+: replace (focus_nav_toggle|close_navigation) with ',
    # groom_edit_restore is reached by CSR route/popstate handling; its
    # behavior is pinned by the browser state-restore tests, while SSR has no
    # browser location or async card lookup to drive it.
    'lib\.rs:\d+:\d+: .* in groom_edit_restore$',
    'lib\.rs:\d+:\d+: replace groom_edit_restore -> ',

    # --- Documented equivalent -------------------------------------------------
    # rows_that_fit's growth-loop guard `count < MAX_TAKE_USIZE` -> `<=`:
    # the trailing `count.clamp(1, MAX_TAKE_USIZE)` dominates — with `<=` the
    # count can transiently reach MAX+1 and is clamped back, so every input
    # yields the identical result. Equivalent by construction.
    'replace < with <= in rows_that_fit',
    # --- Test helpers, not production code --------------------------------------
    # csr_tests::approx is a #[cfg(test)] assertion helper; mutating it only
    # weakens the test suite itself, which no test can or should observe.
    # (The `all(test, ...)` cfg form evades cargo-mutants' own test-code
    # detection, hence the explicit exclusion.)
    'csr_tests::',

    # --- Browser-only label-filter glue (labels on cards, 2026-08-01) --------
    # api::labels / api::next_card are HTTP wrappers (gloo-net): no
    # host-target fetch exists, so host tests cannot observe them. Both are
    # pinned by the browser e2e suite: quiz_label_filter_selects_persists_
    # and_is_independent (03_quiz.rs) drives next_card's labels parameter,
    # and every label-filter test drives the labels list through the panels.
    'replace labels -> Result<Vec<LabelResponse>, String> with ',
    'replace != with == in labels',
    'replace next_card -> Result<NextCardResponse, String> with ',
    # initial_labels (groom and quiz) only READ localStorage, which does not
    # exist on the host target — under ssr the cfg'd branch vanishes and the
    # default is all a host test could observe. The behaviors are e2e-pinned:
    # old_groom_filter_key_translates_to_label_selection (04_groom.rs) drives
    # the legacy-key translation incl. the enabled/disabled match arms and
    # the new-key persistence; filter_and_search_survive_tab_switch_and_
    # reload pins the groom selection restore; the quiz default (Enabled
    # only) is pinned by quiz_label_filter_selects_persists_and_is_
    # independent's first-usage assertion.
    'replace initial_labels -> ',
    'delete match arm "enabled" in initial_labels',
    'delete match arm "disabled" in initial_labels',
    # GroomRow renders only in the browser — the ssr test never reaches a
    # loaded list. disable_enable_toggle (04_groom.rs) pins the label
    # comparisons that were here: badge presence/absence via the label
    # editor (the row Enable/Disable toggle was removed 2026-08-01,
    # subsumed by the editor).
    'replace == with != in GroomRow',
    'replace != with == in GroomRow',

    # --- Browser-only creation-time label picker (2026-08-01) ------------------
    # Editor's new-label guards (empty/comma checks, the Create-disabled
    # condition) and the quiz's selection_ready gating are DOM/localStorage
    # glue no host test can observe. add_card_creates_card_with_chosen_labels
    # (03_quiz.rs) pins the picker end to end: Create disabled until a label
    # is chosen, minting inline, the created card's exact label set. The
    # quiz default (everything selected once the labels list lands) is pinned
    # by quiz_label_filter_selects_persists_and_is_independent's first-usage
    # assertions.
    'editor\.rs:\d+:\d+: (delete !|replace == with !=|replace && with \|\|) in Editor',
    'quiz\.rs:\d+:\d+: delete ! in Quiz',

    # --- Browser-only dedicated label management page (2026-08-01) -----------
    # The CRUD request wrappers are gloo-net calls and the LabelManager is
    # signal/view/modal glue. Host-target SSR tests can render only its
    # initial loading state; they cannot observe request status handling,
    # inline editing, the two-step used-label confirmation, or row removal.
    # Those behaviors are pinned by 10_labels.rs in Chromium, which drives
    # create, rename, exact usage warning, destructive confirmation, cascade
    # verification, and the responsive drawer.
    'api\\.rs:\\d+:\\d+: .* in (create_label|rename_label|delete_label)$',
    'replace (create_label|rename_label|delete_label) -> ',
    'labels\\.rs:\\d+:\\d+: .* in LabelManager$',
    'replace LabelManager -> ',

    # --- Browser-only rename migration and management callback ---------------
    # preserve_selection_after_rename upgrades selections written by the
    # pre-ID UI in window.localStorage. The browser regression in
    # 10_labels.rs exercises the resulting rename-safe Quiz and Groom state;
    # host-target tests cannot provide localStorage or remount the CSR views.
    'replace preserve_selection_after_rename -> ',
    'replace preserve_selection_after_rename with \(\)',
    'replace .* in preserve_selection_after_rename',
    # The groom legacy-key cleanup calls storage_remove through the browser's
    # localStorage API. Its migration behavior is covered by the browser
    # state-restore test, not observable in the host-target build.
    'replace storage_remove with \(\)',
    # LabelManager's ID comparison selects the row being renamed. The CRUD
    # browser test exercises the callback against the rendered row; SSR does
    # not render a loaded label list.
    'replace == with != in LabelManager',
]
